name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/readout.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "docker-compose.yml"
      - "railway*.json"
      - "railpack.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/readout.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "docker-compose.yml"
      - "railway*.json"
      - "railpack.json"

concurrency:
  group: ci-node-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke-plan:
    name: Browser smoke plan
    runs-on: ubuntu-latest
    outputs:
      run_browser_smoke: ${{ steps.browser-smoke-plan.outputs.run_browser_smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Plan browser smoke
        id: browser-smoke-plan
        run: node scripts/ci-browser-smoke-plan.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Translation catalog policy
        run: npm run i18n:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
      - name: Typecheck
        run: npm run typecheck

  # `npm run test:unit` ran every workspace in series in one job: 176s, of
  # which web was 82s, server 52s, and game 28s. Nothing about them is ordered,
  # so they are three jobs. Keep the root script as the one-command local
  # entry point; this split exists for wall clock on hosted runners only.
  unit-web:
    name: Unit tests (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No server build: nothing under apps/web imports @mistboard/server. The
      # old combined job needed it for the server's own unit tests.
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
      - name: Unit tests (web)
        run: npm run test:unit --workspace @mistboard/web

  unit-server:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The server build is required, not incidental: delta-ws.test.ts spawns
      # the compiled apps/server/dist/main.js as a real process.
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
          npm run build --workspace @mistboard/server
      - name: Unit tests (server)
        run: npm run test:unit --workspace @mistboard/server

  # The two pure packages plus the repo's own tooling tests. Small enough to
  # share a runner; splitting further would cost more in setup than it saves.
  unit-shared:
    name: Unit tests (packages, tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
      - name: Tooling tests
        run: npm run test:tooling
      - name: Unit tests (game)
        run: npm run test:unit --workspace @mistboard/game
      - name: Unit tests (board-render)
        run: npm run test:unit --workspace @mistboard/board-render
      - name: Unit tests (mahjong)
        run: npm run test:unit --workspace @mistboard/mahjong

  puzzle-corpus:
    name: Puzzle corpus verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full kernel verification of every shipped puzzle (~24s). Lives here as
      # its own parallel job so the local test:unit hot path only runs a
      # 5-puzzle sample plus a corpus content-hash pin.
      - name: Verify puzzle corpus
        run: npm run test:puzzles:corpus

  integration:
    name: Server integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bichess
          POSTGRES_PASSWORD: bichess
          POSTGRES_DB: bichess
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bichess:bichess@localhost:5432/bichess
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
      - name: Server integration
        run: MISTBOARD_ALLOW_IN_MEMORY_PERSISTENCE=true npm run test:integration --workspace @mistboard/server

  # The Postgres-backed suite was 146s of a 180s step and the longest job in
  # CI. It cannot go parallel inside one database (at --test-concurrency=4 the
  # wall clock does not move and 157 tests fail), so each shard is a job with
  # its own Postgres. See scripts/persistent-shard.mjs for the file split and
  # for the measurements behind it.
  persistent:
    name: Persistent tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bichess
          POSTGRES_PASSWORD: bichess
          POSTGRES_DB: bichess
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bichess:bichess@localhost:5432/bichess
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
      - name: Compile server
        run: npx tsc -p apps/server/tsconfig.json
      - name: Persistent tests (shard ${{ matrix.shard }} of 3)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 3
        run: node scripts/persistent-shard.mjs

  browser-smoke:
    name: Browser smoke
    needs: [browser-smoke-plan]
    if: needs.browser-smoke-plan.outputs.run_browser_smoke == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mistboard
          POSTGRES_PASSWORD: mistboard
          POSTGRES_DB: mistboard
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/mahjong
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The learn-interface smoke that used to run here went with the dark-chess
      # hub it drove. The study-creator smoke below is now the whole of this
      # job's browser coverage, which is why the Playwright install stays.
      - name: Migrate study smoke database
        run: npm run db:migrate
      - name: Study creator persistence smoke
        run: npm run test:study:persistent

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        # Wrapped rather than bare `npm audit`, which exits 1 both for a real
        # advisory and for a registry that did not answer. See the script.
        run: node scripts/audit-prod-deps.mjs

  node:
    name: node
    needs:
      - browser-smoke-plan
      - lint
      - build
      - typecheck
      - unit-web
      - unit-server
      - unit-shared
      - puzzle-corpus
      - integration
      - persistent
      - browser-smoke
      - audit
    # NOT always(): a concurrency-cancelled run must conclude as cancelled, not
    # failure. With always() the aggregator ran anyway, saw cancelled needs, and
    # exited 1, so notify-ci-failure filed phantom "CI red on main" issues
    # (#226, #229). When this job skips, needs.node.result is 'skipped' and
    # neither notify-ci-failure nor close-ci-failure fires.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node <<'EOF'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failures = Object.entries(needs).filter(([name, job]) => {
            if (name === 'browser-smoke' && job.result === 'skipped') return false;
            return job.result !== 'success';
          });
          if (failures.length > 0) {
            for (const [name, job] of failures) {
              console.error(`${name}: ${job.result}`);
            }
            process.exit(1);
          }
          console.log('all required CI jobs passed');
          EOF

  # --- Code-red signal (label: ci-failure) -----------------------------------
  # The `node` job is "did you break the build/tests". Its own self-clearing issue.

  notify-ci-failure:
    # Files (or appends to) the ci-failure issue when the build/test job fails on main.
    needs: [node]
    if: always() && needs.node.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const commitMsg = (context.payload.head_commit?.message ?? '').split('\n')[0];
            const body = [
              `CI (build/test) failed on \`main\` at \`${sha}\` — ${commitMsg}`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CI red on main',
                body,
                labels: ['ci-failure'],
              });
            }

  close-ci-failure:
    # Closes the open ci-failure issue when the build/test job goes green on main.
    needs: [node]
    if: always() && needs.node.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ CI (build/test) green on \`main\` at \`${sha}\` — auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
