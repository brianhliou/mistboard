name: Mistboard Readout

on:
  schedule:
    # Non-round minute reduces scheduled-job contention. The application emits
    # a weekly snapshot on Monday and a silent daily snapshot otherwise.
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Readout trigger"
        required: true
        default: auto
        type: choice
        options: [auto, daily, weekly, manual]
      dry_run:
        description: "Generate a report without storing it or changing issues"
        required: false
        default: false
        type: boolean

concurrency:
  group: mistboard-readout-production
  cancel-in-progress: false

jobs:
  readout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Generate and route readout
        id: readout
        uses: actions/github-script@v9
        env:
          REQUESTED_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const audience = 'https://mistboard.com/api/admin/readouts';
            const oidc = await core.getIDToken(audience);
            const response = await fetch('https://mistboard.com/api/admin/readouts/generate', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${oidc}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                trigger: process.env.REQUESTED_TRIGGER,
                dryRun: process.env.DRY_RUN === 'true',
              }),
              signal: AbortSignal.timeout(60_000),
            });
            if (!response.ok) {
              throw new Error(`readout endpoint failed with HTTP ${response.status}`);
            }
            const payload = await response.json();
            const report = payload.report;
            const markdown = payload.markdown;
            // Version is a FLOOR, not a pin, and the assertions below name the
            // fields this script actually reads. An exact-version check turned the
            // additive v1 -> v2 bump into three days of silent failures against a
            // healthy endpoint; the server owns the schema and only a field we
            // consume may fail the run.
            const unsupported =
              !report || report.kind !== 'mistboard-readout' ||
              !(Number.isInteger(report.schemaVersion) && report.schemaVersion >= 1) ||
              typeof report.snapshotId !== 'string' ||
              typeof report.verdict !== 'string' ||
              typeof report.alertKey !== 'string' ||
              !Array.isArray(report.actions) ||
              typeof markdown !== 'string';
            if (unsupported) {
              throw new Error(
                `readout endpoint returned an unsupported payload: ${JSON.stringify({
                  kind: report?.kind ?? null,
                  schemaVersion: report?.schemaVersion ?? null,
                  hasMarkdown: typeof markdown === 'string',
                })}`,
              );
            }
            await core.summary.addRaw(markdown).write();
            fs.writeFileSync('mistboard-readout.json', `${JSON.stringify(report, null, 2)}\n`);
            fs.writeFileSync('mistboard-readout.md', markdown);
            core.setOutput('snapshot_id', report.snapshotId);

            if (process.env.DRY_RUN === 'true') return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'ops-readout';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '1d76db',
                description: 'Scheduled aggregate operating readouts',
              });
            }

            const needsAttention =
              report.verdict === 'action' ||
              report.verdict === 'blocked' ||
              report.verdict === 'unknown';

            // The anchor is resolved for daily runs too. A daily readout that
            // finds something wrong used to route NOTHING unless one of its
            // actions happened to own an issue, so "healthy daily checks are
            // silent" also silenced the unhealthy ones.
            let anchor = null;
            if (report.trigger === 'weekly' || needsAttention) {
              const { data: anchors } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: label,
                per_page: 10,
              });
              anchor = anchors.find((issue) => issue.title === 'Mistboard weekly readout') ?? null;
              if (!anchor) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'Mistboard weekly readout',
                  body: [
                    'This is the durable anchor for scheduled Mistboard operating readouts.',
                    'Healthy daily checks are silent. Weekly history appears in comments.',
                    '',
                    '<!-- mistboard-readout-anchor -->',
                  ].join('\n'),
                  labels: [label],
                });
                anchor = created.data;
              }
            }

            if (report.trigger === 'weekly' && anchor) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: anchor.number,
                body: [
                  'This is the durable anchor for scheduled Mistboard operating readouts.',
                  'Healthy daily checks are silent. Weekly history appears in comments.',
                  '',
                  markdown,
                  '<!-- mistboard-readout-anchor -->',
                ].join('\n'),
              });
              const weeklyMarker = `<!-- mistboard-readout-week:${report.snapshotKey} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: anchor.number,
                per_page: 100,
              });
              if (!comments.some((comment) => comment.body?.includes(weeklyMarker))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: anchor.number,
                  body: `${markdown}\n${weeklyMarker}`,
                });
              }
            }

            // Keyed by alertKey, not by the snapshot: the same problem holds
            // its key while the counters underneath it move, so a week-long
            // outage posts once instead of seven times.
            if (report.trigger !== 'weekly' && needsAttention && anchor) {
              const alertMarker = `<!-- mistboard-readout-alert:${report.alertKey} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: anchor.number,
                per_page: 100,
              });
              if (!comments.some((comment) => comment.body?.includes(alertMarker))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: anchor.number,
                  body: [
                    `**Daily check: ${report.verdict.toUpperCase()}**`,
                    '',
                    markdown,
                    alertMarker,
                  ].join('\n'),
                });
              }
            }

            for (const action of report.actions) {
              if (!action.ownerIssue) continue;
              const marker = `<!-- mistboard-readout-event:${action.dedupeKey} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: action.ownerIssue,
                per_page: 100,
              });
              if (comments.some((comment) => comment.body?.includes(marker))) continue;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: action.ownerIssue,
                body: [
                  `**Readout ${action.severity}:** ${action.text}`,
                  '',
                  `Snapshot: \`${report.snapshotId}\``,
                  marker,
                ].join('\n'),
              });
            }

      - name: Upload redacted readout
        uses: actions/upload-artifact@v7
        with:
          name: mistboard-readout-${{ steps.readout.outputs.snapshot_id }}
          path: |
            mistboard-readout.json
            mistboard-readout.md
          retention-days: 90

  notify-failure:
    needs: [readout]
    if: always() && needs.readout.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- mistboard-readout-workflow-failure -->';
            const body = [
              'Scheduled Mistboard readout failed.',
              '',
              `Run: ${runUrl}`,
              '',
              marker,
              '<!-- failures:1 -->',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-health',
              per_page: 10,
            });
            if (existing.length > 0) {
              // One comment per outage, edited in place, rather than one per run:
              // a daily cron against a persistent failure otherwise stacks an
              // identical row every day (three of them for the v1/v2 schema pin).
              // Editing keeps the newest run URL visible, so suppressing the
              // duplicate never costs the reader the current link.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                per_page: 100,
              });
              const existingComment = comments.find((comment) =>
                comment.body?.includes(marker),
              );
              if (existingComment) {
                const priorFailures = Number(
                  /<!-- failures:(\d+) -->/.exec(existingComment.body ?? '')?.[1] ?? '1',
                );
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: [
                    `Scheduled Mistboard readout failing (${priorFailures + 1} runs).`,
                    '',
                    `Latest run: ${runUrl}`,
                    '',
                    marker,
                    `<!-- failures:${priorFailures + 1} -->`,
                  ].join('\n'),
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing[0].number,
                  body,
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scheduled Mistboard readout failing',
                body,
                labels: ['prod-health'],
              });
            }
