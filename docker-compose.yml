services:
  postgres:
    image: postgres:16-alpine
    container_name: mistboard-postgres
    environment:
      POSTGRES_DB: mistboard
      POSTGRES_USER: mistboard
      POSTGRES_PASSWORD: mistboard
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - mistboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistboard -d mistboard"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  mistboard-postgres:
