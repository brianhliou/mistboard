# Fortress Xiangqi A/B pair for the Modal bake-off (2026-09-02).
#
# GENERATED — do not hand-edit. Rebuild with:
#   npx tsx scripts/variant-lab/build-fortress-bakeoff-ini.ts   (or the python in
#   the session that made it) from apps/server/src/fortress-xiangqi.ini plus
#   scripts/variant-lab/fortress-xiangqi-treasure-home.ini.
#
# SUPERSEDED LABELS (2026-09-03): the rules shipped that day, so [fortressxiangqi]
# below is no longer what production runs — production is now arm D (river soldier
# + confined Treasure). These arm definitions are kept verbatim so the recorded
# runs stay reproducible; read them as the 2026-09-02 experiment, not as current.
#
# [fortressxiangqi]              the then-shipped rule (Treasure roams and drops anywhere)
# [fortressxiangqitreasurehome]  Treasure confined to its own half
# [fortressxiangqiriver]         river-gated soldier (the pre-2026-07-03 rule)
# [fortressxiangqirivertreasurehome]  both changes at once
#
# The 2x2 is {veteran, river} soldier x {free, confined} Treasure.
#
# The Modal harness sends ONE ini text to every container and picks the variant
# by name, so the two arms have to sit in the same file for an A/B run.

[fortressxiangqi:minixiangqi]
maxRank = 8
startFen = rnceakq/pp1p1pp/7/7/7/7/PP1P1PP/QKAECNR w - - 0 1

# Pieces: full rook chariot, real cannon, eye-horse, palace advisor (ferz),
# river-locked elephant (2-step diagonal), 1-step-omnidirectional Treasure.
horse = n
customPiece1 = r:R
customPiece2 = c:mRcpR
customPiece3 = a:F
customPiece4 = e:nA
customPiece5 = q:WF
# VETERAN SOLDIERS (2026-07-03): forward + sideways always, no promotion — kept in
# sync with the kernel (packages/game/src/variants-fortress-xiangqi.ts). Revert by
# restoring `soldier = p` + `soldierPromotionRank = 5` (the river-gated soldier).
customPiece6 = p:fsW
mandatoryPiecePromotion = false

# Opposite-corner palaces: Red a1-c3, Black e6-g8. The king and advisor
# (CustomPiece3) are confined to their own palace by mobility region.
mobilityRegionWhiteKing = a1 b1 c1 a2 b2 c2 a3 b3 c3
mobilityRegionBlackKing = e6 f6 g6 e7 f7 g7 e8 f8 g8
mobilityRegionWhiteCustomPiece3 = a1 b1 c1 a2 b2 c2 a3 b3 c3
mobilityRegionBlackCustomPiece3 = e6 f6 g6 e7 f7 g7 e8 f8 g8
# Elephant (CustomPiece4) never crosses the river: own half only.
mobilityRegionWhiteCustomPiece4 = *1 *2 *3 *4
mobilityRegionBlackCustomPiece4 = *5 *6 *7 *8

# Crazyhouse drops. Global drop region = the WHOLE board, so attackers
# (chariot/horse/cannon/soldier/treasure — no mobility region) parachute on
# either side incl. the enemy half; advisor (palace) and elephant (own half)
# stay confined by the mobility-region intersection. Drop-check allowed.
pieceDrops = true
capturesToHand = true
dropChecks = true
pocketSize = 16
whiteDropRegion = *1 *2 *3 *4 *5 *6 *7 *8
blackDropRegion = *1 *2 *3 *4 *5 *6 *7 *8
# Newer FSF builds renamed these keys; keep both spellings so the region is
# enforced regardless of the deployed binary version.
dropRegionWhite = *1 *2 *3 *4 *5 *6 *7 *8
dropRegionBlack = *1 *2 *3 *4 *5 *6 *7 *8

# Endings: stalemate = loss (xiangqi); perpetual check/chase = loss for the
# aggressor (Asian chasing rule); honest repetitions still draw.
stalemateValue = loss
chasingRule = axf


