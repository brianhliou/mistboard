# Atomic Xiangqi for Fairy-Stockfish.
#
# Consumed twice: railpack's build gate runs perft against it (see
# fairy-stockfish-atomic-xiangqi.ref for why a patched binary exists at all),
# and the server hands it to the engine as the UCI `VariantPath` option.
#
# Setting UCI_Variant is not sufficient on its own. The engine keeps the
# position it booted with until it is sent an explicit `position`, so a driver
# that omits it gets CHESS: perft(1) reads 20 instead of 44, while the engine
# still reports the variant as loaded.
#
# This is the variant lab's cannon-shot stanza (scripts/variant-lab, adapter
# atomic-xiangqi, rules D13 + D14), verbatim but for the name. Four options
# here do not exist in stock Fairy-Stockfish and are what the patch adds:
# blastShape (the four orthogonal neighbours, not chess's eight),
# blastImmuneTypes (soldiers survive), cannonShotBlasts = false (a cannon's
# capture takes only its target) and lethalCheck = true (for the perpetual
# check law, a move is check if the mover could remove the general next move,
# blast included). The general is a non-royal wazir with extinctionValue, the
# way FSF spells atomic's exploding king, and extinctionPseudoRoyal keeps
# check-legality on it.
#
# nMoveRule = 30 is sixty plies without a capture, the site's clock.

[atomicxiangqi:xiangqi]
flyingGeneral = true
stalemateValue = loss
nMoveRule = 30
perpetualCheckIllegal = true
chasingRule = none
nFoldValue = draw
king = -
wazir = k
mobilityRegionWhiteWazir = d1 e1 f1 d2 e2 f2 d3 e3 f3
mobilityRegionBlackWazir = d8 e8 f8 d9 e9 f9 d10 e10 f10
extinctionValue = loss
extinctionPieceTypes = k
extinctionPseudoRoyal = true
blastOnCapture = true
blastShape = wazir
blastImmuneTypes = p
cannonShotBlasts = false
lethalCheck = true
startFen = rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1
