# KataGo-AnimalChess GTP config for the top jungle seat (jungle-katago-engine.ts).
#
# Derived from the config the challenge matches ran (mistboard-engine
# lab/jungle-katago-2026-09-21/katago-gtp.cfg, itself from Kouza's Dandelion 4
# engine2024_cpu.cfg). The search keys are unchanged from those matches; what
# differs only touches memory, logging and threads:
#   - loopRule NONE, drawJudgeRule DRAW, scoringRule 0: the kernel's threefold
#     repetition, 200-ply rule and scoring govern, as in the matches (#434).
#   - maxVisits is the seat's strength: 150, overridden per move by the driver
#     (kata-set-param), so the tier table is the one place it is set.
#   - nnCacheSizePowerOfTwo 16 and nnMutexPoolSizePowerOfTwo 14 (were 20/20):
#     a move evaluates ~300 positions, so the 2^20 tables were 55 MB of RSS no
#     search could fill. Neither changes what the search does at this budget.
#   - numEigenThreadsPerModel 4: each Eigen thread holds its own transformed copy
#     of the net, ~230 MB apiece, so this is the RAM-for-latency dial. Measured
#     (linux/amd64, 150 visits): 4 threads ~980 MB peak RSS, 2 ~530 MB at ~1.35x
#     the latency, 1 ~300 MB at ~2.1x. The process lives one move, so the peak is
#     transient; nothing stays resident between moves.
#   - no logDir: one process per move would leave one log file per move.

loopRule = NONE
drawJudgeRule = DRAW
scoringRule = 0
noResultUtilityReduce = 0.5
useVCF = true
cpuctExploration = 0.5
useGraphSearch = true
useNoisePruning = true
rootPolicyTemperature = 1.0
nnPolicyTemperature = 1.00
subtreeValueBiasFactor = 0.0
policyLocalFocusPow = 0.0
policyLocalFocusDist = 3.0
koRule = SIMPLE
multiStoneSuicideLegal = false

maxVisits = 150
numSearchThreads = 4
numEigenThreadsPerModel = 4
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 14

allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
playoutDoublingAdvantage = 0.0
playoutDoublingAdvantagePla = WHITE
lagBuffer = 1.0
searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95
ponderingEnabled = false
analysisPVLen = 100

logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false
