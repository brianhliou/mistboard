# Crazyhouse Xiangqi — Fairy-Stockfish product variant.
#
# Standard xiangqi on the 9x10 board with the standard start, plus one
# sentence: a captured piece goes to the capturer's hand, and on your turn you
# may instead drop a piece from hand onto any empty point where that piece
# could stand in a normal xiangqi game; a drop may not give check.
#
# Stock Fairy-Stockfish, no patch: the drop points are the pieces' mobility
# regions (advisors on their five palace points, elephants on their seven
# points, soldiers on the soldier files' two home ranks or anywhere across the
# river); chariot, horse and cannon have no region and drop on any empty point.
# `dropChecks = false` forbids every check a drop creates, a cannon screen
# included.
#
# Every game-ending rule the kernel enforces is set explicitly below, never
# inherited, and apps/server/src/crazyhouse-xiangqi-ini.test.ts pins each one
# to the kernel (an unset option silently takes the engine's default; duck
# xiangqi's nMoveRule did, #472):
#   - flyingGeneral: the generals may not face each other;
#   - stalemateValue = loss: the side with no legal move loses, mated or not;
#   - nFoldRule = 3, nFoldValue = draw, perpetualCheckIllegal: a three-fold
#     repetition is a draw unless one side checked throughout, which loses;
#   - chasingRule = none: the kernel has no chase law. The built-in xiangqi
#     parent sets AXF chasing, so leaving this out would have the engine score
#     repetitions the kernel draws as losses;
#   - nMoveRule = 0: the kernel draws after 60 plies without a CAPTURE
#     (CRAZYHOUSE_XIANGQI_PROGRESS_CLOCK_LIMIT), but Fairy-Stockfish resets its
#     counter on every DROP as well (position.cpp, "Reset rule 50 counter for
#     irreversible drops"; measured on the stock binary 2026-10-01, see the
#     test). No value of nMoveRule matches a clock a drop does not reset, so
#     the engine keeps no move-count draw and the server adjudicates it.
#
# Lab name `stockc` (docs-private/drop-game-lab/fullboard/, "one-sentence C"),
# verified identical to the lab engine on 127 game positions. FEN letters:
# k=general, a=advisor, b=elephant, n=horse, r=chariot, c=cannon, p=soldier;
# the pocket rides in brackets after the placement. Keep this in sync with
# the game kernel (packages/game/src/variants-crazyhouse-xiangqi.ts): the
# parity fixture (scripts/generate-crazyhouse-xiangqi-parity-fixture.mjs ->
# packages/game/src/fixtures/crazyhouse-xiangqi-parity.json) ties the two
# together. Regenerate it on any edit here.

[crazyhousexiangqi:xiangqi]
startFen = rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR[] w - - 0 1
pieceDrops = true
capturesToHand = true
dropChecks = false
flyingGeneral = true
stalemateValue = loss
nFoldRule = 3
nFoldValue = draw
perpetualCheckIllegal = true
chasingRule = none
nMoveRule = 0
mobilityRegionWhiteFers = d1 f1 e2 d3 f3
mobilityRegionBlackFers = d8 f8 e9 d10 f10
mobilityRegionWhiteElephant = c1 g1 a3 e3 i3 c5 g5
mobilityRegionBlackElephant = c6 g6 a8 e8 i8 c10 g10
mobilityRegionWhiteSoldier = a4 a5 c4 c5 e4 e5 g4 g5 i4 i5 *6 *7 *8 *9 *10
mobilityRegionBlackSoldier = *1 *2 *3 *4 *5 a6 a7 c6 c7 e6 e7 g6 g7 i6 i7
