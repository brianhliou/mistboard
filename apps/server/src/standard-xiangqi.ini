# Standard xiangqi: the kernel draws after 120 plies without a capture.
# FSF counts full moves; its built-in xiangqi defaults to 50 (100 plies).
# Keep all other rules and the calibrated levels unchanged.
#
# NNUE is selected by the variant prefix in the net's filename. The build
# checksums the official xiangqi net, copies it to mistboardxiangqi-<hash>.nnue,
# and requires an actual NNUE search with this variant (fetch-fsf-xiangqi-net.sh).
[mistboardxiangqi:xiangqi]
nMoveRule = 60
nMoveRuleTypes = -
