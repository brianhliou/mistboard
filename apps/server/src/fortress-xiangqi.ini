# Fortress Xiangqi — Fairy-Stockfish product variant.
#
# "Xiangqi with a pocket." 7x8 board, two 3x3 palaces in OPPOSITE corners
# (pinwheel), faithful xiangqi movement plus the 1-step Treasure, and
# crazyhouse-style drops: both-side attacker drops + the chasing rule (perpetual
# check/chase = loss for the aggressor).
#
# This is the flattened, self-contained form of the lab's blessed flagship
# `zmini-drop-ck-bs-chase` (docs-private/drop-game-lab/zmini.ini), inheriting
# FSF's built-in `minixiangqi` (7-wide board, cannon/horse/soldier, flying
# general) and layering on: 8 ranks, corner palaces via king/advisor mobility
# regions, a river-locked elephant, the Treasure (WF), and the drops.
#
# FEN letters: k=general, r=chariot, c=cannon, n=horse, a=advisor, e=elephant,
# q=treasure, p=soldier. Keep this in sync with the game kernel
# (packages/game/src/variants-fortress-xiangqi.ts); a per-move parity harness
# (scripts/variant-lab/fortress-xiangqi-fsf-play.ts) asserts FSF only plays
# kernel-legal moves. Re-run it on any edit here.

[fortressxiangqi:minixiangqi]
maxRank = 8
startFen = rnceakq/pp1p1pp/7/7/7/7/PP1P1PP/QKAECNR w - - 0 1

# Pieces: full rook chariot, real cannon, eye-horse, palace advisor (ferz),
# river-locked elephant (2-step diagonal), 1-step-omnidirectional Treasure.
horse = n
customPiece1 = r:R
customPiece2 = c:mRcpR
customPiece3 = a:F
customPiece4 = e:nA
customPiece5 = q:WF
# RIVER SOLDIER (2026-09-02, reverting the 2026-07-03 veteran ship): forward only on
# the own half, +sideways after the river — kept in sync with the kernel
# (packages/game/src/variants-fortress-xiangqi.ts). The veteran soldier took draws
# from 12% to 34%; see the 2026-09-02 section of the lab DESIGN-SPEC.
soldier = p
soldierPromotionRank = 5
mandatoryPiecePromotion = false

# Opposite-corner palaces: Red a1-c3, Black e6-g8. The king and advisor
# (CustomPiece3) are confined to their own palace by mobility region.
mobilityRegionWhiteKing = a1 b1 c1 a2 b2 c2 a3 b3 c3
mobilityRegionBlackKing = e6 f6 g6 e7 f7 g7 e8 f8 g8
mobilityRegionWhiteCustomPiece3 = a1 b1 c1 a2 b2 c2 a3 b3 c3
mobilityRegionBlackCustomPiece3 = e6 f6 g6 e7 f7 g7 e8 f8 g8
# Elephant (CustomPiece4) never crosses the river: own half only.
mobilityRegionWhiteCustomPiece4 = *1 *2 *3 *4
mobilityRegionBlackCustomPiece4 = *5 *6 *7 *8
# Treasure (CustomPiece5) never crosses the river either (2026-09-02): the piece
# being stormed for stays in the fortress. FSF derives drop legality from the drop
# region intersected with this mobility region, so this also stops it parachuting.
mobilityRegionWhiteCustomPiece5 = *1 *2 *3 *4
mobilityRegionBlackCustomPiece5 = *5 *6 *7 *8

# Crazyhouse drops. Global drop region = the WHOLE board, so the attackers with no
# mobility region (chariot/horse/cannon/soldier) parachute on either side incl. the
# enemy half; advisor (palace), elephant and treasure (own half) stay confined by
# the mobility-region intersection. Drop-check allowed.
pieceDrops = true
capturesToHand = true
dropChecks = true
pocketSize = 16
whiteDropRegion = *1 *2 *3 *4 *5 *6 *7 *8
blackDropRegion = *1 *2 *3 *4 *5 *6 *7 *8
# Newer FSF builds renamed these keys; keep both spellings so the region is
# enforced regardless of the deployed binary version.
dropRegionWhite = *1 *2 *3 *4 *5 *6 *7 *8
dropRegionBlack = *1 *2 *3 *4 *5 *6 *7 *8

# Endings: stalemate = loss (xiangqi); perpetual check/chase = loss for the
# aggressor (Asian chasing rule); honest repetitions still draw.
stalemateValue = loss
chasingRule = axf
