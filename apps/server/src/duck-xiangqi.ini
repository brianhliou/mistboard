# Duck Xiangqi for Fairy-Stockfish.
#
# Consumed twice: railpack's build gate runs perft against it (see
# fairy-stockfish-duck-xiangqi.ref for why a patched binary exists at all), and
# the server hands it to the engine as the UCI `VariantPath` option.
#
# Setting UCI_Variant is not sufficient on its own. The engine keeps the
# position it booted with until it is sent an explicit `position`, so a driver
# that omits it gets CHESS: perft(1) reads 20 instead of 2554, while the engine
# still reports the variant as loaded.
#
# A turn is one UCI token with both halves: `a1a2,a2a1` is the piece move, a
# comma, then the duck's move. A driver that reads only the first half throws
# away the duck placement.
#
# Follows FSF's own duck_variant recipe: the royal KING is replaced by a
# non-royal COMMONER, because parser.cpp refuses `wallingRule = duck` with a
# royal king outright ("Can not use kings with wallingRule = duck").
#
# The replacement is a WAZIR, not a commoner. FSF's duck variant uses a commoner
# because a chess king moves in all eight directions; xiangqi's general does not
# (xiangqi_variant_base sets kingType = WAZIR). Using a commoner here gave the
# general two illegal diagonal moves and perft(1) = 2670 against our 2554, the
# difference being exactly those two moves x 58 duck points = 116.
#
# Swapping the piece costs the palace confinement, which xiangqi_variant_base
# attaches to KING, so the mobility regions are restated for the commoner.
#
# stalemateValue = loss is D9, our deliberate divergence from Duck Chess, which
# sets VALUE_MATE here (the fowling rule).
#
# chasingRule is dropped: AXF chasing law is built on perpetual check, and D4
# removes check.

[duckxiangqi:xiangqi]
king = -
wazir = k
extinctionValue = loss
extinctionPieceTypes = k
mobilityRegionWhiteWazir = d1 e1 f1 d2 e2 f2 d3 e3 f3
mobilityRegionBlackWazir = d8 e8 f8 d9 e9 f9 d10 e10 f10
wallingRule = duck
stalemateValue = loss
flyingGeneral = true
chasingRule = none
startFen = rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1
