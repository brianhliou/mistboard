<title id="t">Evaluation of one blitz game by Lichess at one million nodes and by Stockfish at twenty million</title>
<desc id="d">Two lines over 71 half-moves. They track each other for nineteen moves and split at move 20, where the deeper search rates the position two pawns better for White before the move and a mistake after it; Lichess marked eight White moves and eleven Black moves elsewhere and nothing at move 20.</desc>
