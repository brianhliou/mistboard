<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1240" height="1240">
  <!-- Duck Xiangqi rail marker. A one-colour ALPHA mask, like the PNG markers
       beside it: the silhouette is opaque, the ground is transparent, and the
       rail tints it with the surrounding text colour. SVG rather than PNG
       because this one is drawn from paths rather than exported from artwork,
       so there is no resolution to pick and nothing to re-export.

       The eye is a second subpath under fill-rule="evenodd", so it is a HOLE in
       the mask rather than a lighter shape painted on top. A mask has no
       colours to paint with; anything that is not cut out is solid. -->
  <path fill="#000" fill-rule="evenodd" d="
    M20.5 57.5
    C20.5 48.5 30 42.5 43 42
    C45.5 35 49 28.5 55.5 24.5
    C55 17.5 60 12 67.5 12
    C74.5 12 80 17 80.5 23.5
    L93.5 27.5
    C94.6 27.8 94.6 29.4 93.5 29.8
    L80 34
    C78.6 38 75 41 70.5 41.8
    C67 45 65 49 64.5 53
    C76 55.5 83.5 62 83.5 69
    C83.5 79.5 68 87 50 87
    C33 87 19 80.5 16.5 71.5
    C12 70 8 67 5.5 63
    C4.9 62 5.6 60.8 6.7 61
    L17.5 62.8
    C17.7 61 18.9 59 20.5 57.5 Z
    M72.6 21.5
    A2.5 2.5 0 1 1 67.6 21.5
    A2.5 2.5 0 1 1 72.6 21.5 Z" />
