<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under a notch / home indicator and
         is what makes env(safe-area-inset-*) resolve to anything but 0. The site
         nav and page gutters spend those insets back as padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Free Online Chinese Chess (Xiangqi) | Mistboard</title>

      name="description"
      content="Bringing people together across cultures through Chinese chess. Play xiangqi, jieqi and banqi online for free, against a bot or a friend, no sign-up."

    <!-- The page's one robots tag: lets search show a large image preview (the
         Article JSON-LD offers 16:9, 4:3 and 1:1 cards). A noindex page has this
         tag REPLACED, never a second one added (server-static-pages.ts
         setRobotsMeta, prerender-articles.mjs). -->
    <meta name="robots" content="max-image-preview:large" />
    <meta name="theme-color" content="#1f2521" />
    <!-- Two icons by size: browsers draw the tab from the 32px full-bleed mark;
         Google needs 48px or more, so its circle crop takes the padded 512px one. -->

    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />

    <script>
      (() => {
        const key = "mistboard.siteTheme";
        const allowed = new Set(["system", "light", "dark"]);
        let stored = "system";
        try {
          const value = window.localStorage.getItem(key);
          if (allowed.has(value)) stored = value;
        } catch {
          /* localStorage may be unavailable in private contexts. */
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches === true;
        const resolved = stored === "dark" || (stored === "system" && prefersDark) ? "dark" : "light";
        document.documentElement.dataset.siteTheme = stored;
        document.documentElement.dataset.effectiveTheme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", resolved === "dark" ? "#121615" : "#ebefee");
      })();
    </script>
    <!-- Hides the phone bar's baked piece-set icon when it is not the set
         this reader will get, until main.ts redraws it. Source and reasons:
         src/piece-set-first-paint.ts; its test fails if this copy drifts. -->
    <script>
      (() => {
        const root = document.documentElement;
        let id = "";
        try {
          const SETS = ["international","traditional","simplified","lacquer","wood","book","brush","clerical","animal-dobutsu"];
          const RETIRED = ["western","symbols","international-flat","animal-flat"];
          const LEGACY = {"animal":"animal-dobutsu","animal-seal":"animal-dobutsu","animal-origami":"animal-dobutsu"};
          const HANZI_COUNTRIES = ["CN","TW","HK","MO","SG","MY","VN"];
          const LOCALES = ["en","zh-Hans","zh-Hant"];
          const LOCALE_PATHS = [["/zh-hans","zh-Hans"],["/zh-hant","zh-Hant"]];
          const SCRIPT_BY_LANGUAGE = {"yue":"zh-Hant","zh":"zh-Hans"};
          const HANT_SCRIPTS = ["hant","cht"];
          const HANS_SCRIPTS = ["hans","chs"];
          const HANT_REGIONS = ["tw","hk","mo"];
          const HANS_REGIONS = ["cn","sg","my"];
          const localeFromTag = (language) => {
            if (!language) return null;
            const subtags = language.toLowerCase().split("-");
            const primary = subtags[0];
            if (primary === "en") return "en";
            const fallback = primary ? SCRIPT_BY_LANGUAGE[primary] : undefined;
            if (!fallback) return null;
            if (subtags.some((subtag) => HANT_SCRIPTS.includes(subtag))) return "zh-Hant";
            if (subtags.some((subtag) => HANS_SCRIPTS.includes(subtag))) return "zh-Hans";
            if (subtags.some((subtag) => HANT_REGIONS.includes(subtag))) return "zh-Hant";
            if (subtags.some((subtag) => HANS_REGIONS.includes(subtag))) return "zh-Hans";
            return fallback;
          };
          const currentLocale = () => {
            const languages = navigator.languages.length > 0 ? navigator.languages : [navigator.language];
            const path = window.location.pathname.toLowerCase();
            for (const [prefix, locale] of LOCALE_PATHS) {
              if (path === prefix || path.startsWith(prefix + "/")) return locale;
            }
            try {
              const stored = window.localStorage.getItem("mistboard.locale");
              if (LOCALES.includes(stored)) return stored;
            } catch {
              /* Unreadable storage holds no chosen locale. */
            }
            for (const tag of languages) {
              const locale = localeFromTag(tag);
              if (locale) return locale;
            }
            return "en";
          };
          const firstLocale = () => {
            try {
              const stored = window.localStorage.getItem("mistboard.firstLocale");
              if (LOCALES.includes(stored)) return stored;
            } catch {
              /* The app reads the current locale then; it writes it, this does not. */
            }
            return currentLocale();
          };
          const inferred = () => {
            const locale = firstLocale();
            let country = null;
            for (const part of document.cookie.split(";")) {
              const [name, value] = part.trim().split("=");
              if (name === "mb_cc" && value && /^[A-Z]{2}$/.test(value)) {
                country = value;
                break;
              }
            }
            const listed = navigator.languages ?? [];
            const languages = listed.length > 0 ? listed : navigator.language ? [navigator.language] : [];
            const hanzi = "traditional";
            if (locale === "zh-Hans" || locale === "zh-Hant") return hanzi;
            for (const tag of languages) {
              const listedLocale = localeFromTag(tag);
              if (listedLocale === "zh-Hans" || listedLocale === "zh-Hant") return hanzi;
            }
            if (country && HANZI_COUNTRIES.includes(country)) return hanzi;
            return "international";
          };
          const read = () => {
            const preview = new URLSearchParams(window.location.search).get("xqPieces");
            if (SETS.includes(preview)) return preview;
            const storage = window.localStorage;
            const version = storage.getItem("mistboard.xiangqiPieceSetVersion");
            let raw = storage.getItem("mistboard.xiangqiPieceSet");
            if (version !== "4" && raw === "international") raw = null;
            if (raw !== null && RETIRED.includes(raw)) return inferred();
            if (raw !== null && Object.prototype.hasOwnProperty.call(LEGACY, raw)) return LEGACY[raw];
            return SETS.includes(raw) ? raw : inferred();
          };
          let set;
          try {
            set = read();
          } catch {
            set = inferred();
          }
          if (SETS.includes(set)) {
            const style = document.createElement("style");
            style.id = "piece-set-first-paint";
            style.textContent =
              'html[data-piece-set-pending="' + set + '"] .site-nav-quick-piece:not([data-piece-set="' + set + '"]) { visibility: hidden; }';
            document.head.append(style);
            id = set;
          }
        } catch {
          id = "";
        }
        root.setAttribute("data-piece-set-pending", id);
        if (id === "international") {
          try {
            let path = window.location.pathname.toLowerCase();
            while (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
            for (const [prefix] of [["/zh-hans","zh-Hans"],["/zh-hant","zh-Hant"]]) {
              if (path === prefix || path.startsWith(prefix + "/")) path = path.slice(prefix.length) || "/";
            }
            const PRELOADS = {"/":["/piece-sets/xiangqi/international/red-general.png?v=18","/piece-sets/xiangqi/international/red-advisor.png?v=18","/piece-sets/xiangqi/international/red-elephant.png?v=18","/piece-sets/xiangqi/international/red-horse.png?v=18","/piece-sets/xiangqi/international/red-chariot.png?v=18","/piece-sets/xiangqi/international/red-cannon.png?v=18","/piece-sets/xiangqi/international/red-soldier.png?v=18","/piece-sets/xiangqi/international/black-general.png?v=18","/piece-sets/xiangqi/international/black-advisor.png?v=18","/piece-sets/xiangqi/international/black-elephant.png?v=18","/piece-sets/xiangqi/international/black-horse.png?v=18","/piece-sets/xiangqi/international/black-chariot.png?v=18","/piece-sets/xiangqi/international/black-cannon.png?v=18","/piece-sets/xiangqi/international/black-soldier.png?v=18","/piece-sets/xiangqi/international/red-crossed-soldier.png?v=18","/piece-sets/xiangqi/international/black-crossed-soldier.png?v=18"],"/analysis/xiangqi":["/piece-sets/xiangqi/international/red-general.png?v=18","/piece-sets/xiangqi/international/red-advisor.png?v=18","/piece-sets/xiangqi/international/red-elephant.png?v=18","/piece-sets/xiangqi/international/red-horse.png?v=18","/piece-sets/xiangqi/international/red-chariot.png?v=18","/piece-sets/xiangqi/international/red-cannon.png?v=18","/piece-sets/xiangqi/international/red-soldier.png?v=18","/piece-sets/xiangqi/international/black-general.png?v=18","/piece-sets/xiangqi/international/black-advisor.png?v=18","/piece-sets/xiangqi/international/black-elephant.png?v=18","/piece-sets/xiangqi/international/black-horse.png?v=18","/piece-sets/xiangqi/international/black-chariot.png?v=18","/piece-sets/xiangqi/international/black-cannon.png?v=18","/piece-sets/xiangqi/international/black-soldier.png?v=18"]};
            if (Object.prototype.hasOwnProperty.call(PRELOADS, path)) {
              for (const href of PRELOADS[path]) {
                const link = document.createElement("link");
                link.rel = "preload";
                link.as = "image";
                link.href = href;
                link.setAttribute("fetchpriority", "high");
                document.head.append(link);
              }
            }
          } catch {
            /* The board asks for its pieces itself. */
          }
        }
        window.addEventListener(
          "error",
          (event) => {
            if (event.target === window || event.target instanceof HTMLScriptElement) {
              root.removeAttribute("data-piece-set-pending");
            }
          },
          true,
        );
      })();
    </script>
    <script>
      // The homepage's games-played line starts its read here, beside the
      // download of the page's own script, and writes the total into the
      // prerendered page as soon as both are there, so a visitor sees the
      // number instead of a dash for the half second the script takes to
      // load. live-stats-client.ts adopts this read; the mounted widget then
      // renders the full line.
      (() => {
        const path = window.location.pathname.replace(/\/+$/, "").toLowerCase();
        if (path !== "" && path !== "/zh-hans" && path !== "/zh-hant") return;
        const read = fetch("/api/live-stats", { headers: { accept: "application/json" } })
          .then((resp) => (resp.ok ? resp.json() : null))
          .catch(() => null);
        window.__mistboardLiveStats = read;
        const fill = (data) => {
          const total = data?.totalCompletedGames;
          const value = document.querySelector(".landing-activity-value");
          if (typeof total !== "number" || value?.textContent !== "–") return;
          value.textContent = new Intl.NumberFormat("en-US").format(total);
        };
        read.then((data) => {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => fill(data), { once: true });
          } else {
            fill(data);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
