<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under a notch / home indicator and
         is what makes env(safe-area-inset-*) resolve to anything but 0. The site
         nav and page gutters spend those insets back as padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Free Online Chinese Chess (Xiangqi) | Mistboard</title>
    <meta
      name="description"
      content="Play Chinese chess (xiangqi) online, free and in English. Server-enforced rules, engine analysis, puzzles, and a course from the first move."
    />
    <meta name="theme-color" content="#1f2521" />
    <link rel="icon" href="/logo-mark.png" type="image/png" sizes="512x512" />
    <!-- Announcement archive as RSS (built by prerender-articles.mjs), so a
         reader can follow updates without opening the site. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Mistboard updates"
      href="/feed.xml"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mistboard" />
    <meta property="og:title" content="Mistboard | Free Online Chinese Chess (Xiangqi)" />
    <meta
      property="og:description"
      content="Chinese chess for chess players, and original strategy games. Free and open source."
    />
    <meta property="og:url" content="https://mistboard.com/" />
    <meta property="og:image" content="https://mistboard.com/og-image.png?v=6" />
    <meta property="og:image:alt" content="Mistboard: free online Chinese chess (xiangqi) in English" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mistboard | Free Online Chinese Chess (Xiangqi)" />
    <meta
      name="twitter:description"
      content="Chinese chess for chess players, and original strategy games. Free and open source."
    />
    <meta name="twitter:image" content="https://mistboard.com/og-image.png?v=6" />
    <link rel="stylesheet" href="/src/board-interactions.css" />
    <script>
      (() => {
        const key = "mistboard.siteTheme";
        const allowed = new Set(["system", "light", "dark"]);
        let stored = "system";
        try {
          const value = window.localStorage.getItem(key);
          if (allowed.has(value)) stored = value;
        } catch {
          /* localStorage may be unavailable in private contexts. */
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches === true;
        const resolved = stored === "dark" || (stored === "system" && prefersDark) ? "dark" : "light";
        document.documentElement.dataset.siteTheme = stored;
        document.documentElement.dataset.effectiveTheme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", resolved === "dark" ? "#121615" : "#ebefee");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
